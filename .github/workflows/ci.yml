name: Polaris CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R runtime
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install dependencies
        run: |
          Rscript -e 'if (!requireNamespace("jsonlite", quietly=TRUE)) install.packages("jsonlite", repos="https://cloud.r-project.org")'

      - name: Enforce zero em/en dash invariant
        run: |
          Rscript tools/lint_em_dashes.R

      - name: Compile native acceleration kernel
        run: |
          make build

      - name: Execute comprehensive test suite
        run: |
          make test

      - name: Run 16 formal acceptance gates
        run: |
          make acceptance

      - name: Audit evidence bundle via 14 negative controls
        run: |
          make verify

      - name: Execute performance benchmarks
        run: |
          make benchmark
